<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tcxMediaPipe</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101317;
        color: #f4f7fb;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #101317;
      }

      #camera {
        display: block;
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        background: #161b21;
        pointer-events: none;
        z-index: 1;
      }

      #camera.mirrored {
        transform: scaleX(-1);
      }

      #preview {
        display: none;
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        background: #161b21;
        pointer-events: none;
        z-index: 1;
      }

      body.use-canvas-preview #camera {
        opacity: 0;
      }

      body.use-canvas-preview #preview {
        display: block;
      }

      #status {
        position: fixed;
        left: 16px;
        bottom: 16px;
        max-width: min(560px, calc(100vw - 32px));
        padding: 10px 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        background: rgba(16, 19, 23, 0.78);
        backdrop-filter: blur(12px);
        z-index: 2;
      }

      #status-title {
        margin: 0 0 4px;
        font-size: 13px;
        font-weight: 600;
      }

      #status-detail {
        margin: 0;
        color: #b9c2ce;
        font-size: 12px;
        line-height: 1.35;
      }

      #status[data-state="ready"] #status-title {
        color: #75e6a5;
      }

      #status[data-state="error"] #status-title {
        color: #ff7a7a;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-B20_Yjfd.js"></script>
  </head>
  <body>
    <video id="camera" autoplay playsinline muted></video>
    <canvas id="preview"></canvas>
    <div id="status" data-state="idle">
      <p id="status-title">tcxMediaPipe starting</p>
      <p id="status-detail">Waiting for configuration from TrussC.</p>
    </div>
  </body>
</html>
